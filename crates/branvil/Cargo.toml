[package]
name = "branvil"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Branvil: a lightweight local code hosting service (Git, tickets, pull requests, CI) for GuildBotics"
license = "MIT"
repository = "https://github.com/GuildBotics/GuildBotics"
publish = false
# The integration tests are one test crate (`tests/main.rs`).
autotests = false

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", features = ["macros"] }
# RS256 for GitHub App JWTs; already in the tree as rustls' crypto provider.
aws-lc-rs = { version = "1.18.2", default-features = false, features = ["aws-lc-sys"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
futures-util = "0.3.34"
# The data directory's lock handed to the service's Git (`git::hold`).
libc = "0.2"
loopback-auth = { path = "../loopback-auth" }
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
redb = "4.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rust-embed = "8.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2"
tokio = { version = "1.53.3", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.1.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = "3.0.0"
tar = "0.4.46"
crc32fast = "1.5.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
toml_edit = "0.25.17"


[dev-dependencies]
tempfile = "3.27.0"

[[test]]
name = "main"
path = "tests/main.rs"
