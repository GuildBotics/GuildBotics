[package]
name="gb-runner"
version="0.1.0"
edition="2024"
rust-version="1.90"
description = "Shared CI runner and runner API types for the Hub and remote clients"
license = "MIT"
repository = "https://github.com/GuildBotics/GuildBotics"
publish = false

[dependencies]
oci-spec = { version = "0.9.0", default-features = false, features = ["distribution"] }
gb-base = { path = "../gb-base" }
gb-vm = { path = "../gb-vm" }
tempfile = "3.27.0"
anyhow = "1"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
futures-util = "0.3.34"
libc = "0.2"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
tracing = "0.1"
tar = "0.4.46"
crc32fast = "1.5.0"
getrandom="0.4.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[features]
test-support=[]
host = ["gb-vm/host"]

[dev-dependencies]
axum="0.8.9"
