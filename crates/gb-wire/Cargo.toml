[package]
name = "gb-wire"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "The wire between GuildBotics' host and a command's isolated environment, generated from the schemas of wire/schema"
license = "MIT"
repository = "https://github.com/GuildBotics/GuildBotics"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
prettyplease = "0.2"
schemars = "0.8"
serde_json = "1.0.154"
syn = "2"
typify = "0.6.2"
