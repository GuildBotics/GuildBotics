[package]
name = "guildbotics"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "GuildBotics: the server and the command line, with Branvil in the same process"
license = "MIT"
repository = "https://github.com/GuildBotics/GuildBotics"
publish = false

[dependencies]
anyhow = "1"
branvil = { path = "../branvil" }
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.53.3", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
