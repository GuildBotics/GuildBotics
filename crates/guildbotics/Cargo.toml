[package]
name = "guildbotics"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "GuildBotics: the server and the command line, with Branvil in the same process"
license = "MIT"
repository = "https://github.com/GuildBotics/GuildBotics"
publish = false

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"
anyhow = "1"
branvil = { path = "../branvil" }
crossterm = "0.29"
clap = { version = "4.6.7", features = ["derive"] }
gb-server = { path = "../gb-server" }
gb-base = { path = "../gb-base" }
gb-environment = { path = "../gb-environment" }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
flate2 = "1"
sha2 = "0.11.1"
tar = "0.4"
loopback-auth = { path = "../loopback-auth" }
