[package]
name = "gb-config"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "GuildBotics' configuration as running a command reads it: the team, and which file a command name runs with what it declares"
license = "MIT"
repository = "https://github.com/GuildBotics/GuildBotics"
publish = false

[dependencies]
gb-base = { path = "../gb-base" }
sha1 = "0.11"
anyhow = "1"
gb-wire = { path = "../gb-wire" }
serde-saphyr = "2.0.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
base64 = "0.22"
sha2 = "0.11.1"
regex = "1"
tracing = "0.1"
unicode-ident = "1"
unicode-normalization = "0.1"
unicode-case-mapping = "1"
aes-gcm = "0.10"
zeroize = "1"
serde = { version = "1.0.229", features = ["derive"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored", "crypto-rust"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.11.1"
