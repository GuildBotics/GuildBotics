[package]
name = "gb-observability"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "GuildBotics' records of what ran: traces, and the diagnostics index and transcripts the screens read"
license = "MIT"
repository = "https://github.com/GuildBotics/GuildBotics"
publish = false

# The integration tests are modules of tests/main.rs.
autotests = false

[dependencies]
base64 = "0.22"
anyhow = "1.0.102"
gb-base = { path = "../gb-base" }
serde = { version = "1.0.228", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# A file-to-file comparison hides lossy parsing on both sides; HTTP must
# preserve the duration floats Python wrote as well.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
url = "2.5.8"

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["full"] }

[[test]]
name = "main"
path = "tests/main.rs"
