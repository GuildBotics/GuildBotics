[package]
name = "gb-observability"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "GuildBotics' records of what ran: traces, and the diagnostics index and transcripts the screens read"
license = "MIT"
repository = "https://github.com/GuildBotics/GuildBotics"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["full"] }
