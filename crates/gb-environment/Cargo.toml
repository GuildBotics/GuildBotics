[package]
name = "gb-environment"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A command's isolated environment: the microVM it runs in, booted from the workspace's snapshot"
license = "MIT"
repository = "https://github.com/GuildBotics/GuildBotics"
publish = false

[dependencies]
iana-time-zone = "0.1.65"
chrono-tz = { version = "0.10", default-features = false }
base64 = "0.22"
libc = "0.2"
url = "2.5.8"
unicode-normalization = "0.1"
cap-std = "4.0.3"
cap-fs-ext = "4.0"
same-file = "1.0"
unicase = "2.10"
gb-base = { path = "../gb-base" }
gb-config = { path = "../gb-config" }
gb-wire = { path = "../gb-wire" }
# `prebuilt` downloads, while building, the guest agent this crate embeds
# (the release's `agentd`): a build from source needs it built beside. The
# runtime that boots the microVMs is the placed `msb`, with its own copy.
microsandbox = { version = "=0.6.17", default-features = false, features = ["net", "prebuilt"] }
microsandbox-utils = "=0.6.17"
serde_json = "1.0.154"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11.1"
tar = "0.4"
flate2 = "1"
tempfile = "3.27.0"
anyhow = "1"
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
