[package]
name = "gb-base"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "What every part of GuildBotics' host stands on: where the machine's records are, checked host paths, file locks, and the one way shared files are written"
license = "MIT"
repository = "https://github.com/GuildBotics/GuildBotics"
publish = false

[dependencies]
cap-std = "4.0.3"
cap-fs-ext = "4.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
