[package]
name = "gb-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "GuildBotics' server: its port, its owner's credentials, and its API"
license = "MIT"
repository = "https://github.com/GuildBotics/GuildBotics"
publish = false

[features]
default = ["server"]
server = ["gb-environment/host", "dep:croner", "dep:rcgen", "dep:tokio-rustls", "dep:hyper", "dep:hyper-util", "dep:gb-integrations", "dep:branvil", "dep:gb-setup", "dep:mime_guess"]
[dependencies]
tower = { version = "0.5.3", features = ["util"] }
croner = { version = "4.0.3", optional = true }
shlex = "2.0.1"
cap-std = "4.0.3"
cap-fs-ext = "4.0"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tempfile = "3.27.0"
sha2 = "0.11.1"
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
futures-util = "0.3"
rcgen = { version = "0.14", optional = true }
regex = "1"
tokio-rustls = { version = "0.26", optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "service"], optional = true }
time = "0.3"
anyhow = "1"
axum = { version = "0.8.9", features = ["multipart", "ws"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
gb-base = { path = "../gb-base" }
gb-config = { path = "../gb-config" }
gb-member = { path = "../gb-member" }
gb-integrations = { path = "../gb-integrations", optional = true }
gb-ports = { path = "../gb-ports" }
branvil = { path = "../branvil", optional = true }
gb-environment = { path = "../gb-environment", default-features = false }
gb-observability = { path = "../gb-observability" }
gb-setup = { path = "../gb-setup", optional = true }
gb-wire = { path = "../gb-wire" }
gb-workspace = { path = "../gb-workspace" }
loopback-auth = { path = "../loopback-auth" }
mime_guess = { version = "2.0.5", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-tungstenite = "0.29"
tokio = { version = "1.53.3", features = ["test-util"] }
x509-parser = "0.18"
