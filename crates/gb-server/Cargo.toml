[package]
name = "gb-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "GuildBotics' server: its port, its owner's credentials, and its API"
license = "MIT"
repository = "https://github.com/GuildBotics/GuildBotics"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
gb-base = { path = "../gb-base" }
gb-config = { path = "../gb-config" }
gb-environment = { path = "../gb-environment" }
gb-observability = { path = "../gb-observability" }
gb-wire = { path = "../gb-wire" }
gb-workspace = { path = "../gb-workspace" }
loopback-auth = { path = "../loopback-auth" }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1"
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
