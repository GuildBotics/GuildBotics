[package]
name = "gb-workspace"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "GuildBotics' workspaces on this machine: which one the server opens, and the identities of the workspace and of the machine"
license = "MIT"
repository = "https://github.com/GuildBotics/GuildBotics"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
gb-base = { path = "../gb-base" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1", features = ["v7"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
