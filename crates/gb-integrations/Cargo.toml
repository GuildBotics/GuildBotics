[package]
name = "gb-integrations"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Service provider integration and shared completion decisions"
license = "MIT"
repository = "https://github.com/GuildBotics/GuildBotics"
publish = false

[dependencies]
gb-ports = { path = "../gb-ports" }
serde_json = "1.0.154"
unicode-casefold = "0.2"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
gb-config = { path = "../gb-config" }
gb-base = { path = "../gb-base" }
branvil = { path = "../branvil" }
regex = "1"
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }
tokio = { version = "1", features = ["sync", "rt", "time", "macros", "net"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
sha2 = "0.10"
anyhow = "1"
tracing = "0.1"

[dev-dependencies]
serde-saphyr = "2.0.0"
syn = { version = "2", features = ["full", "visit"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[[test]]
name = "branvil-integration"
path = "tests/branvil/main.rs"
harness = false
