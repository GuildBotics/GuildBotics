# The checks of every push and pull request. GitHub Actions runs only what
# this runner cannot: macOS Clippy
# (.github/workflows/ci.yml), and Branvil E2E
# (.github/workflows/branvil-e2e.yml).
# The runner supplies the image version, CPUs, memory and network access.
# Commands start in /work, a Git checkout of the commit with its history and
# tags, as a user that is not root, with CI metadata only; each array entry has
# its own shell. Keep dependency caches here, rather than relying on HOME, and
# point CARGO_HOME here too: the image's is not writable to the job, and
# `uv sync` builds dependencies without a wheel for this Python with Cargo.
# PR heads select jobs by paths; default-branch and landing-gate runs execute
# every job. test and markdown-links always run, as their inputs span the repo.
#
# The Rust jobs check the whole Cargo workspace. The cache restores `target`
# built from other commits, which can look newer than the checked-out files:
# touching the crates first makes them newer than any restored output, so
# Cargo rebuilds the workspace's crates and reuses only the dependencies.
# Incremental data would save little of that rebuild and fill the cache
# (CARGO_INCREMENTAL=0; measured in crates/branvil/docs/performance.md,
# "Branvil's own pipeline").
# Use the toolchain, rather than Cargo.lock, for the Rust cache keys for now:
# workspace crate additions change the lockfile before the protected branch
# can save that key, leaving PR heads and gates without dependencies to restore.
# Cargo still resolves the locked dependencies and rebuilds touched crates.
# The current runner refreshes protected-branch caches after 24 hours; changing
# the toolchain starts a new generation. Ticket #120 will restore lockfile keys
# when the runner can restore from a recent generation and retain gate caches.

[[jobs]]
name = "test"
image = "guildbotics/agent-environment:dev"
commands = ['''
set -eu
export UV_CACHE_DIR=/work/.ci/uv UV_LOCKED=1 CARGO_HOME=/work/.ci/cargo-home
uv sync --extra test --extra dev
uv run --no-sync python scripts/generate-wire-schema.py --check
uv run --no-sync ruff format --check guildbotics tests
uv run --no-sync ruff check guildbotics
uv run --no-sync mypy guildbotics
uv run --no-sync pylint guildbotics
uv run --no-sync lint-imports
cargo build --locked -p gb-base --example worktree-list
uv run --no-sync python -m pytest tests/ --ignore=tests/blackbox -n auto --durations=30
''']
timeout_secs = 3600
cache = { paths = [".ci/uv"], key_files = ["uv.lock"] }

[[jobs]]
name = "markdown-links"
image = "guildbotics/agent-environment:dev"
commands = ["lychee --no-progress --scheme file --include-fragments --extensions md './*.md' docs desktop skills crates"]
timeout_secs = 300

[[jobs]]
name = "desktop-quality"
paths = ["packages/ui/**", "desktop/**", "package.json", "package-lock.json", "crates/branvil/web/package.json"]
image = "guildbotics/agent-environment:dev"
commands = [
  "npm_config_cache=/work/.ci/npm npm ci",
  "cd desktop && npm_config_cache=/work/.ci/npm npm run quality",
]
timeout_secs = 1800
cache = { paths = [".ci/npm"], key_files = ["package-lock.json"] }

[[jobs]]
name = "rust-fmt"
paths = [
  "crates/*/src/**",
  "crates/*/tests/**",
  "crates/*/examples/**",
  "crates/*/Cargo.toml",
  "crates/*/build.rs",
  "Cargo.toml",
  "Cargo.lock",
  "rust-toolchain*",
  ".cargo/**",
  "clippy.toml",
  "rustfmt.toml",
]
image = "guildbotics/agent-environment:dev"
commands = ["CARGO_HOME=/work/.ci/cargo-home cargo fmt --all --check"]
timeout_secs = 300

[[jobs]]
name = "rust-clippy"
paths = [
  "crates/*/src/**",
  "crates/*/tests/**",
  "crates/*/examples/**",
  "crates/*/Cargo.toml",
  "crates/*/build.rs",
  "Cargo.toml",
  "Cargo.lock",
  # gb-server embeds the locale files it says things from.
  "guildbotics/templates/locales/**",
  # gb-wire generates its types from the schemas.
  "wire/schema/**",
  "rust-toolchain*",
  ".cargo/**",
  "clippy.toml",
  "rustfmt.toml",
]
image = "guildbotics/agent-environment:dev"
commands = [
  "find crates -exec touch -c {} +",
  "CARGO_HOME=/work/.ci/cargo-home CARGO_INCREMENTAL=0 cargo clippy --locked --workspace --all-targets -- -D warnings",
]
timeout_secs = 1800
cache = { paths = [".ci/cargo-home/registry", "target"], key_files = ["rust-toolchain.toml"] }

[[jobs]]
name = "rust-test"
paths = [
  "crates/*/src/**",
  "crates/*/tests/**",
  "crates/*/examples/**",
  "crates/*/Cargo.toml",
  "crates/*/build.rs",
  "Cargo.toml",
  "Cargo.lock",
  # gb-server embeds the locale files it says things from.
  "guildbotics/templates/locales/**",
  # The records both versions write, which the golden tests read.
  "records/**",
  # gb-wire generates its types from the schemas, and the golden tests read
  # the wire's cases and the bundled commands.
  "wire/**",
  "guildbotics/templates/commands/**",
  "rust-toolchain*",
  ".cargo/**",
  "clippy.toml",
  "rustfmt.toml",
]
image = "guildbotics/agent-environment:dev"
commands = [
  "find crates -exec touch -c {} +",
  "CARGO_HOME=/work/.ci/cargo-home CARGO_INCREMENTAL=0 cargo nextest run --locked --workspace",
]
timeout_secs = 1800
cache = { paths = [".ci/cargo-home/registry", "target"], key_files = ["rust-toolchain.toml"] }

# Drive the public command line and its HTTP server with the same Rust binary.
[[jobs]]
name = "rust-cli-blackbox"
paths = ["crates/**", "guildbotics/**", "skills/guildbotics/**", "tests/blackbox/**", "tests/conftest.py", "docs/cli_reference.md", "pyproject.toml", "uv.lock", "Cargo.toml", "Cargo.lock", "rust-toolchain*", ".cargo/**"]
image = "guildbotics/agent-environment:dev"
commands = ['''
set -eu
export UV_CACHE_DIR=/work/.ci/uv UV_LOCKED=1 CARGO_HOME=/work/.ci/cargo-home CARGO_INCREMENTAL=0
uv sync --extra test
cargo build --locked -p gb-server --example browser-test-server
cargo build --locked -p guildbotics
target/debug/guildbotics generate-cli-reference --check
export GUILDBOTICS_BLACKBOX_CLI="$PWD/target/debug/guildbotics"
export GUILDBOTICS_BLACKBOX_MEMBER_CLI="$PWD/target/debug/examples/browser-test-server"
export GUILDBOTICS_BLACKBOX_SERVER="$PWD/target/debug/examples/browser-test-server"
export GUILDBOTICS_BLACKBOX_PROVIDER=local
uv run --no-sync python -m pytest tests/blackbox/test_member.py tests/blackbox/test_code_host.py tests/blackbox/test_config_service.py tests/blackbox/test_harness.py tests/blackbox/test_golden.py
''']
timeout_secs = 1800
cache = { paths = [".ci/cargo-home/registry", "target", ".ci/uv"], key_files = ["rust-toolchain.toml", "uv.lock"] }

# Exercise the Rust provider and Branvil in the same process.
[[jobs]]
name = "branvil-integration"
paths = ["crates/branvil/**", "crates/gb-integrations/**", "crates/gb-member/**", "crates/gb-workspace/**", "crates/gb-observability/**", "crates/gb-ports/**", "crates/gb-config/**", "crates/gb-base/**", "guildbotics/**", "tests/guildbotics/guest/alert_command_fixture.py", "pyproject.toml", "uv.lock", "scripts/branvil-integration.sh", "Cargo.toml", "Cargo.lock", "rust-toolchain*", ".cargo/**"]
image = "guildbotics/agent-environment:dev"
commands = ["find crates -exec touch -c {} +", "UV_CACHE_DIR=/work/.ci/uv CARGO_HOME=/work/.ci/cargo-home CARGO_INCREMENTAL=0 bash scripts/branvil-integration.sh"]
timeout_secs = 1800
cache = { paths = [".ci/cargo-home/registry", "target", ".ci/uv"], key_files = ["rust-toolchain.toml", "uv.lock"] }

# Duplicated Rust code, by the same jscpd as desktop's `npm run duplicates`.
[[jobs]]
name = "rust-duplicates"
paths = ["crates/**/*.rs", "jscpd.rust.json"]
image = "guildbotics/agent-environment:dev"
commands = ["npm_config_cache=/work/.ci/npm npx --yes jscpd@5.0.14 --config jscpd.rust.json"]
timeout_secs = 300
cache = { paths = [".ci/npm"], key_files = ["jscpd.rust.json"] }

[[jobs]]
name = "branvil-web"
paths = ["packages/ui/**", "crates/branvil/web/**", "crates/branvil/tests/fixtures/**", "package.json", "package-lock.json", "desktop/package.json"]
image = "guildbotics/agent-environment:dev"
commands = [
  "npm_config_cache=/work/.ci/npm npm ci",
  "cd crates/branvil/web && npm run lint",
  "cd crates/branvil/web && npm run typecheck",
  "cd crates/branvil/web && npm run test",
]
timeout_secs = 1200
cache = { paths = [".ci/npm"], key_files = ["package-lock.json"] }
artifacts = [{ name = "web-tests", paths = ["crates/branvil/web/test-results/timing.json"] }]
