# The checks of every push and pull request. GitHub Actions runs only what
# this runner cannot: the Windows contracts (.github/workflows/ci.yml) and the
# Desktop E2E (.github/workflows/desktop-e2e.yml).
# The runner supplies the image version, CPUs, memory and network access.
# Commands start in /work, a Git checkout of the commit with its history and
# tags, as a user that is not root, with CI metadata only; each array entry has
# its own shell. Keep dependency caches here, rather than relying on HOME, and
# point CARGO_HOME here too: the image's is not writable to the job, and
# `uv sync` builds dependencies without a wheel for this Python with Cargo.

[[jobs]]
name = "test"
image = "guildbotics/agent-environment:dev"
commands = ['''
set -eu
export UV_CACHE_DIR=/work/.ci/uv UV_LOCKED=1 CARGO_HOME=/work/.ci/cargo-home
uv sync --extra test --extra dev
uv run --no-sync python scripts/generate-cli-reference.py --check
uv run --no-sync ruff format --check guildbotics tests
uv run --no-sync ruff check guildbotics
uv run --no-sync mypy guildbotics
uv run --no-sync pylint guildbotics
uv run --no-sync lint-imports
uv run --no-sync python -m pytest tests/ -n auto --durations=30
''']
timeout_secs = 3600
cache = { paths = [".ci/uv"], key_files = ["uv.lock"] }

[[jobs]]
name = "markdown-links"
image = "guildbotics/agent-environment:dev"
commands = ["lychee --no-progress --scheme file --include-fragments --extensions md './*.md' docs desktop skills"]
timeout_secs = 300

[[jobs]]
name = "desktop-quality"
image = "guildbotics/agent-environment:dev"
commands = [
  "cd desktop && npm_config_cache=/work/.ci/npm npm ci",
  "cd desktop && npm_config_cache=/work/.ci/npm npm run quality",
]
timeout_secs = 1800
cache = { paths = [".ci/npm"], key_files = ["desktop/package-lock.json"] }

# The `branvil` provider against a real Branvil (Branvil's README, "Checking
# with GuildBotics"): Branvil's main cloned from GitHub, as a job reaches only
# public networks, and its scripts/guildbotics-smoke.sh run with this commit.
[[jobs]]
name = "branvil-integration"
image = "guildbotics/agent-environment:dev"
commands = ['''
set -eu
git clone --quiet --depth 1 https://github.com/GuildBotics/Branvil.git /tmp/branvil
export CARGO_HOME=/work/.ci/cargo-home
UV_CACHE_DIR=/work/.ci/uv UV_LOCKED=1 uv sync --extra test --extra dev
CARGO_TARGET_DIR=/work/.ci/branvil-target CARGO_INCREMENTAL=0 \
  /tmp/branvil/scripts/guildbotics-smoke.sh /work
''']
timeout_secs = 1800
cache = { paths = [".ci/uv", ".ci/cargo-home/registry", ".ci/branvil-target"], key_files = ["uv.lock"] }
