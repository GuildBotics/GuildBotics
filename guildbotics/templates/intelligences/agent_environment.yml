# The isolated agent environment every AI CLI turn of this workspace runs in.
#
# This file is shared between the devices of the workspace, and each device
# builds the same environment from it. GuildBotics provides the base image
# (Debian with Node.js, npm, git and uv) and installs the AI CLI tools at the
# versions it was verified with.
#
# A workspace may instead start from an image it built itself, for another
# toolchain (a Python interpreter, Rust, a browser). Build it FROM the default
# image, or from one that gives the build the same: Node.js with npm, curl and
# tar. Do
# not ship bubblewrap (`bwrap`): Codex prefers it to the one it bundles and
# cannot start a session with Debian's.
# The image is not shared, and it is per CPU architecture (the environment
# runs the device's own CPU): build it for each architecture the workspace's
# devices run, name it here by reference and by the digest of each build
# (`guildbotics environment image declare`), and load the archive (`docker
# save`) on each device with `guildbotics environment image load`. A device
# runs on the image it loaded under the reference: none loaded refuses turns,
# another digest than declared (or none declared for its architecture) runs
# with a warning that says how to fall in line.
#
#   image:
#     reference: local/agent:1
#     digests:
#       arm64: sha256:<64 hex digits>
#       amd64: sha256:<64 hex digits>
#
# Memory and virtual CPUs assigned whenever a turn or snapshot-build microVM
# boots. These values take effect on the next boot; changing them does not
# rebuild the disk snapshot.
resources:
  memory_mib: 4096
  cpus: 2

# One rule covers every member, slot, command, and provider web feature. The
# allowlist below is a starting point for common coding work with package
# registries and GitHub. Omit this block to deny all non-provider traffic.
# `unrestricted` is an explicit escape hatch: a turn could then send readable
# workspace content anywhere
# or fetch a payload from any Internet host.
network:
  mode: allowlist
  allowed_domains:
    - pypi.org
    - files.pythonhosted.org
    - registry.npmjs.org
    - github.com
    - api.github.com
    - raw.githubusercontent.com
    - codeload.github.com
    - objects.githubusercontent.com
    - release-assets.githubusercontent.com
    - static.crates.io
    - index.crates.io
  allow_local_network: false

# The upstream DNS resolvers the environment forwards queries to: a list of
# IPv4 addresses, shared as written. The default is public resolvers, so the
# environment resolves names the same way on every device and does not
# inherit the quirks of a LAN router. `host` instead reads the IPv4 resolvers
# of whichever device runs the turn, for networks that block outside DNS;
# private answers are dropped by the environment either way.
dns:
  nameservers: [1.1.1.1, 8.8.8.8]
