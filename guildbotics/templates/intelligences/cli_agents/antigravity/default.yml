# Effort mapping for the native Antigravity AI CLI tool. A tool takes its
# label, order and executable from the built-in catalog, so only the effort
# mapping belongs here.
#
# `model` and `effort` are mutually exclusive: every id in `agy models` either
# carries its tier (`gemini-3.6-flash-low`) or refuses `--effort` altogether
# (`claude-sonnet-4-6`), and `agy` rejects the pair. Setting both in one slot
# keeps the model and drops the effort.
effort:
  low:
    effort: low
  high:
    effort: high

# `effort` values come from `agy --help`; `model` is left to a picker because
# the ids depend on the account (see `agy models`).
effort_fields:
  - key: effort
    type: enum
    values: [low, medium, high]
  - key: model
    type: model_id

# Where commands and the tool's built-in web features may connect. Both routes
# start closed; open only the route a workflow needs, to the domains it needs.
# `mode` is one of deny / allowlist / unrestricted (`off` would read as a YAML
# boolean). A slot that states `network` states the whole block.
network:
  command:
    mode: deny
    allowed_domains: []
    allow_local_network: false
  web:
    mode: deny
    allowed_domains: []
