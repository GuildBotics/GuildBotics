# Effort mapping for the native Claude Code AI CLI tool.
#
# Native tools have no configuration file of their own; this file exists solely
# to translate the provider-neutral effort labels (low / high) into settings the
# Claude Code adapter can apply.
#
# `default` is deliberately absent, and is rejected if written: it means "do not
# intervene", so a mapping for it could never be applied.
#
# Claude Code fixes these when the session starts and a resumed session cannot be
# reconfigured, so changing them starts a fresh session (see `settings_scope`).
effort:
  low:
    effort: low
  high:
    effort: high

# The settings an editor may offer for each level. `effort` values are the
# levels `claude --help` advertises for `--effort`; `model` is left to a picker
# because the valid ids depend on the installation, not on this file.
effort_fields:
  - key: effort
    type: enum
    values: [low, medium, high, xhigh, max]
  - key: model
    type: model_id

# Where commands and the tool's built-in web features may connect. Both routes
# start closed; open only the route a workflow needs, to the domains it needs.
# `mode` is one of deny / allowlist / unrestricted (`off` would read as a YAML
# boolean). A slot that states `network` states the whole block.
network:
  command:
    mode: deny
    allowed_domains: []
    allow_local_network: false
  web:
    mode: deny
    allowed_domains: []
