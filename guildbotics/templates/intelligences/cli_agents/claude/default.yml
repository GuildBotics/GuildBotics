# Effort mapping for the native Claude Code AI CLI tool.
#
# Native tools have no configuration file of their own; this file exists solely
# to translate the provider-neutral effort labels (low / high) into settings the
# Claude Code adapter can apply.
#
# `default` is deliberately absent, and is rejected if written: it means "do not
# intervene", so a mapping for it could never be applied.
#
# Claude accepts --model and --effort with --resume. Changing either setting
# keeps the session; when a setting is omitted, the adapter re-sends the last
# value recorded for that session.
effort:
  low:
    effort: low
  high:
    effort: high

# The settings an editor may offer for each level. `effort` values are the
# levels `claude --help` advertises for `--effort`; `model` is left to a picker
# because the valid ids depend on the installation, not on this file.
effort_fields:
  - key: effort
    type: enum
    values: [low, medium, high, xhigh, max]
  - key: model
    type: model_id
