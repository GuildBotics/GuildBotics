# Effort mapping for the native GitHub Copilot AI CLI tool.
#
# Native tools have no configuration file of their own; this file exists solely
# to translate the provider-neutral effort labels (low / high) into settings the
# Copilot adapter can apply. Do not add `script` or `env` here.
#
# `default` is deliberately absent, and is rejected if written: it means "do not
# intervene", which leaves a resumed session on the settings it already has.
#
# `copilot --acp` exposes these as session configuration options rather than as
# launch flags, so the adapter re-applies them on every turn instead of starting
# a fresh session.
#
# The values below come from Copilot itself, not from guesswork: they are the
# options its `reasoning_effort` select lists in the `session/new` response on
# GitHub Copilot CLI 1.0.77, whose `currentValue` is `medium`. They are a subset
# of what `copilot --help` advertises for `--effort`, which also names `minimal`
# and `max`; the session option is what this adapter can actually set.
#
# The list is reported per session, so re-check it with `session/new` after
# switching models.
effort:
  low:
    reasoning_effort: low
  high:
    reasoning_effort: high

effort_fields:
  - key: reasoning_effort
    type: enum
    values: [none, low, medium, high, xhigh]
  - key: model
    type: model_id
