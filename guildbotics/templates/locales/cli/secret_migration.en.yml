en:
  description: One-time offline migration from the macOS keychain to encrypted Rust SecretStores.
  identity: Identity root
  workspace: Every workspace root; repeat for each
  writers_stopped: Confirm all Python/Rust servers, CLI writers and git helpers are stopped
  failed: Secret migration stopped (stage=%{stage}). %{reason} Keep all writers stopped.
  reasons:
    platform: Run the inventory on macOS.
    inventory: Cannot enumerate keychain attributes; check keychain access.
    namespace: Namespace is missing or invalid; check local/secrets.json in every root.
    encrypted_file: Encrypted record is malformed; verify the sealed file and device key.
    inventory_key: Inventory is ambiguous or lacks the device key; check the keychain.
    device_key: Device key differs from the selected key; check keychain selection.
    duplicate_namespace: Multiple roots name the same namespace; check root selection.
    index_mismatch: Index and ciphertext names disagree; verify both records before retrying.
    source_missing: An indexed value is absent from both keychain and ciphertext; restore the source.
    conflict: Source and encrypted destination differ; determine the correct value before retrying.
    git_token: Git token is missing or conflicts with the destination; verify the connection.
    unmapped: Unmapped GuildBotics items follow. Supply omitted roots; see the orphan-item procedure in docs/secret_migration.md.
    verification: Destination readback failed; verify ciphertext and index. No source cleanup has started.
    source_changed: Source changed during cleanup; stop all writers and reconcile the source.
    deletion: Source deletion did not succeed; check keychain delete permission.
    remaining: Final inventory is not exactly the device key. Inspect the listed attributes before retrying.
    key_missing: Device key is missing; restore access to the original device key.
    backend: Backend operation failed; check permissions, keychain access, index and encrypted files for the reported stage.
      Backend details are suppressed.
