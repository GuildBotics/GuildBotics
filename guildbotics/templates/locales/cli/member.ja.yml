ja:
  content:
    exclusive: "--content-stdin と --content-file のどちらか一方だけを指定してください。"
    required: "--content-stdin または --content-file の指定が必要です。"
    stdin_help: "コマンドの自由記述本文全体を標準入力から読み取ります。"
    file_help: "コマンドの自由記述本文全体を UTF-8 ファイルから読み取ります。"
    file_not_utf8: "本文ファイルが有効な UTF-8 ではありません: %{path}"
    file_read_failed: "本文ファイル %{path} を読み取れませんでした: %{error}"
    file_in_environment: "隔離環境のコマンドは本文を --content-stdin で渡します（host はその環境のファイルを読みません）。"
  lease:
    invalid_delegation: member command を実行できません。呼び出し元の turn がこのメンバーの execution lease を持っていません（read-only のコマンドの turn は持ちません）。
    unavailable: person execution lease は既に使用されています。
    unavailable_with_holder: "person execution lease は PID %{pid}（%{source}: %{command}）が使用しています。"
  run:
    required: "このコマンドは呼び出し元の %{kind} ワークフローの実行を対象とするため、その実行の中でだけ使えます。"
  sync:
    invalid_identity: "Workspace 同期を開始できませんでした。%{path} が不正です。コマンドによる変更はまだ行われていません。ファイルを修復してから再実行してください。"
  chat_updates:
    catching_up: "受信したメッセージがWorkspace同期の書き込みロック待ちで保存されていません。少し待ってchat updatesを再試行してください。この状態だけを理由に公開やblocked完了を行わないでください。"
    invalid_run: "このメンバーのチャット入力が実行にありません。"
    unavailable: "チャット受信が停止しているか、受信状態の更新が途絶えています。受信の復旧を待ち、公開操作は行わないでください。"
    not_checked: "この入力に対する新着確認がまだ行われていません。"
    new_messages: "前回の確認後に元のスレッドへ新着メッセージが届いています。"
    required: "%{reason} guildbotics member chat updates --person %{person} を実行し、結果を読んで操作内容を再検討してから再試行してください。"
