en:
  unreachable: "This machine has no credential that the GuildBotics server on this port accepts, or nothing proves to be that server there. On the server machine, start GuildBotics; on another machine, forward the port to the server and run `guildbotics connect` first. If forwarding is not installed, follow the initial setup in docs/branvil_integration.en.md (Set up SSH forwarding on another machine), using scripts/hub-forward.ps1 on Windows."
  refused: "The GuildBotics server refused the request: %{reason}"
  consent: "Allow this machine on the consent screen in your browser. If it did not open, open this address:\n%{url}"
  callback_received: "GuildBotics received the answer. You can close this page."
  consent_timeout: "No answer came from the consent screen in time. Run `guildbotics connect` again."
  denied: "The consent screen did not allow this machine."
  connected: "This machine's CLI is connected to the GuildBotics server."
  invalid_token: "The server returned an invalid application token."
  invalid_link: "The GuildBotics server returned an invalid entry link."
  update_unavailable: "The Hub has no client release for this build yet. Wait for the Windows and Linux client CI jobs, then run scripts/hub-server.sh update on the Hub."
  update_installed: "Installed client %{version}; resuming the command."
  update_failed: "Client update failed: %{reason}\nNo command was run. Check the Hub client release and retry, or install the client from the Hub."
  update_invalid_version: "The Hub health response has no version. Check the Hub installation."
  update_unsupported: "This OS has no distributed client. Build the CLI from the same commit as the Hub."
  update_changed: "The client release changed. Retry the command."
  update_missing_hash: "The release has no sha256."
  update_hash_mismatch: "Client sha256 mismatch."
  update_skills_failed: "Skill installation failed. Retry guildbotics install before running the command."
  runner_service_failed: "Runner service registration failed. Run guildbotics runner join again."
  runner_joined: "This machine joined as a CI runner."
  runner_join_required: "Run guildbotics runner join first."
  runner_version_changed: "The Hub version changed. Restarting the runner after draining its attempts."
  runner_runtime_invalid: "Runner runtime integrity or version verification failed."
  runner_join_unsupported: "Runner join supports Windows x86_64 and Linux x86_64 with glibc. On other platforms, run guildbotics runner with an explicit --token or GUILDBOTICS_RUNNER_TOKEN."
  runner_kvm_unavailable: "Runner join needs read and write access to /dev/kvm: %{reason}. Enable KVM and grant your desktop user access, then sign in again."
