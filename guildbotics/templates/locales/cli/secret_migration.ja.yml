ja:
  description: macOS のキーチェーンから Rust の暗号化 SecretStore への一度限りのオフライン移行。
  identity: identity root
  workspace: 全ワークスペースの root。個別に繰り返し指定
  writers_stopped: Python/Rust のサーバー・CLI の書き込み・git helper が全て停止していることを確認
  failed: 秘密の移行を停止しました（段階=%{stage}）。%{reason} 全ての書き込みを停止したままにしてください。
  reasons:
    platform: 項目一覧は macOS で取得してください。
    inventory: キーチェーンの属性一覧を取得できません。アクセス権を確認してください。
    namespace: 名前空間が欠損または不正です。各 root の local/secrets.json を確認してください。
    encrypted_file: 暗号化した記録が不正です。暗号文と端末鍵を確認してください。
    inventory_key: 一覧が重複しているか端末鍵がありません。キーチェーンを確認してください。
    device_key: 端末鍵が選択した鍵と異なります。キーチェーンの選択を確認してください。
    duplicate_namespace: 複数の root が同じ名前空間を指定しています。指定を確認してください。
    index_mismatch: 索引と暗号文の名前が一致しません。両方の記録を確認してください。
    source_missing: 索引の値がキーチェーンにも暗号文にもありません。移行元を復元してください。
    conflict: 移行元と暗号化した移行先の値が異なります。正しい値を確認してください。
    git_token: git トークンが欠損しているか移行先と競合しています。接続設定を確認してください。
    unmapped: 所属不明の GuildBotics 項目を以下に示します。省略した root を指定するか、docs/secret_migration.md の孤立項目の手順を確認してください。
    verification: 移行先の読み戻し照合に失敗しました。暗号文と索引を確認してください。移行元の削除は開始していません。
    source_changed: 削除中に移行元が変更されました。全ての書き込みを停止して値を確認してください。
    deletion: 移行元の削除に失敗しました。キーチェーンの削除権限を確認してください。
    remaining: 最終一覧が端末鍵1件だけになっていません。以下の属性を確認してから再実行してください。
    key_missing: 端末鍵がありません。元の端末鍵へのアクセスを復元してください。
    backend: 処理に失敗しました。示された段階の権限・キーチェーンへのアクセス・索引・暗号文を確認してください。バックエンドの詳細は伏せています。
