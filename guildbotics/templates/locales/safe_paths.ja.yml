ja:
  active_workspace: "選択中のワークスペースは登録を外せません。先に別のワークスペースを選択してください。"
  invalid: "パスが不正です: %{path}。親への移動を含まないローカルの絶対パスを指定してください。"
  unavailable: "%{path}を安全に開けません: %{reason}。"
  protected_unavailable: "保護対象「%{protected}」またはそのリンク先を検査できません: %{reason}"
  link: "%{path}にはリンクを使用できません。実際のディレクトリを指定してください。"
  copy_link: "リンク「%{path}」を通したファイルのコピーはできません。元のファイルを直接指定してください。エージェントが書き込める場所のリンクは拒否します。"
  file_missing: "ファイルが見つかりません: %{path}。元のファイルをもう一度選択してください。"
  registry: "ワークスペースの登録簿%{path}を読み込めません: %{reason}。ワークスペースの選択やコマンド実行の前に、このファイルを修復してください。"
  missing: "ディレクトリが存在しません: %{path}。"
  protected_credentials: "%{path}は共有できません。資格情報または端末の状態を置く%{protected}と重なります。別の作業ディレクトリを指定するか、アクセスを許可する範囲を狭めてください。"
  protected_workspace: "%{path}は共有できません。ワークスペースの状態を置く%{protected}と重なります。ワークスペースを作業リポジトリの外へ移すか、別の作業ディレクトリを指定してください。この端末で使わなくなったワークスペースは「端末とHub → 登録済みのワークスペース」で登録を外せます。"
  protected_local: "%{path}は共有できません。この端末の設定でアクセスを拒否した%{protected}と重なります。アクセスを許可する範囲を狭めるか、拒否したディレクトリの設定を見直してください。"
  workspace_granted: "ワークスペース%{path}は作成・選択できません。アクセスを許可したディレクトリ%{granted}の中にあります。許可したディレクトリと受け渡しフォルダの外を指定してください。"
