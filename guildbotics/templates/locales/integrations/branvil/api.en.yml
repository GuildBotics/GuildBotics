en:
  authentication: "Branvil rejected the member's token. Reissue it in the member's Branvil settings."
  not_found: "Branvil has no such item: %{message}"
  unsupported: "Branvil does not offer this: %{message}"
  head_moved: "The pull request's head is no longer the commit the member read: read the new commits, then submit again on the current head."
  label_undefined: "A label is not defined in the repository. %{message} Ask a human to add the label instead of introducing a new one."
  refused: "Branvil refused %{operation} (%{status} %{code}): %{message}"
  timeout: "Branvil at %{base_url} did not answer in time. Retry later."
  unreachable: "Branvil is not reachable at %{base_url}. On a machine other than the Hub, check that the Branvil tunnel is running."
  not_branvil: "The service at %{base_url} is not Branvil's API v1."
  invalid: "Branvil returned an invalid response."
  token_missing: "The member has no Branvil token (%{name}) on this machine. Save the member to issue one, or fetch it from the Hub under Credentials on this machine."
  not_connected: "GuildBotics is not connected to Branvil on this machine. Connect it under Setup → Integrations, or fetch BRANVIL_ADMIN_TOKEN from the Hub under Credentials on this machine."
  admin_refused: "Branvil refused GuildBotics' connection. Connect to Branvil again under Setup → Integrations."
  username_missing: "The member has no Branvil username (account_info.branvil_username)."
  identity_mismatch: "The member's Branvil token belongs to '%{name}', not to the member's Branvil username '%{username}'."
  not_ticket: "%{url} is not a Branvil ticket URL."
  not_pull_request: "%{url} is not a Branvil pull request URL."
  not_path: "'%{path}' is not a Branvil repository path."
  alerts: "Branvil keeps no dependency alerts."
  foreign_ticket: "Branvil knows the pull requests of its own tickets, not of %{url}."
  closes_foreign: "A merge into %{repository} closes only a ticket of this Branvil, not %{url}."
  no_head: "%{url} has no head commit."
  no_base: "The base branch of %{url} is gone."
  artifact_too_large: "Artifact '%{name}' is above the %{limit} byte limit. Ask a human to retrieve it."
  every_on_board: "Branvil keeps every ticket on its workspace's board: a ticket is not created off it."
