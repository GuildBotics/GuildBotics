en:
  resource: "Unsupported repository read resource. Allowed resource: dependency_alerts."
  repository: "Specify a repository as owner/name, without a URL or path."
  identifier: "For GitHub, use a positive alert number as identifier; omit it for a collection."
  parameters: "Invalid conditions. dependency_alerts accepts state (open, resolved, dismissed) and page_size (1–100); a request with an identifier accepts no conditions."
  continuation: "Invalid pagination response or continuation. Reuse the same resource, repository, identifier, and conditions."
  too_large: "The GitHub response exceeds the page limit. Reduce page_size for a collection; an oversized individual item cannot be returned."
  response: "GitHub returned an invalid response; no page was accepted."
  rate_limit: "GitHub rate-limited the request. Wait before retrying; no page was retrieved."
  authentication: "GitHub rejected authentication. Check the member's GitHub credentials."
  forbidden: "GitHub denied access. Check that the member's credentials (approved GitHub App permissions or fine-grained PAT permissions) allow reading Dependabot alerts and accessing the target repository. This response alone does not establish the cause."
  not_found: "GitHub could not return this resource. It may not exist, be inaccessible, or have Dependabot alerts disabled. Check the repository, alert number, access, and feature settings."
  rejected: "GitHub rejected the read conditions or temporarily limited this endpoint. Check the conditions and retry later."
  http: "GitHub read failed (HTTP %{status}); no page was retrieved."
  transport: "Could not complete the GitHub request. Check connectivity and retry."
