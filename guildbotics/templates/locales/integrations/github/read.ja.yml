ja:
  too_large: "GitHub の応答がページ上限を超えました。一覧では page_size を減らしてください。個別項目が上限を超える場合は返せません。"
  response: "GitHub の応答形式が不正なため、ページを取得できませんでした。"
  rate_limit: "GitHub がリクエストを制限しました。時間をおいて再試行してください。ページは未取得です。"
  authentication: "GitHub が認証を拒否しました。メンバーの GitHub 認証情報を確認してください。"
  forbidden: "GitHub がアクセスを拒否しました。メンバーの GitHub App または fine-grained PAT に、承認済みの %{permission} の読み取り権限と、このリポジトリへのアクセスがあるか確認してください。この応答だけでは原因は確定できません。"
  not_found: "GitHub からリソースを取得できませんでした。リポジトリ・番号と、%{permission} の読み取り権限を確認してください。"
  alerts_disabled: "リポジトリで Dependabot alerts が無効になっている可能性もあります。"
  rejected: "GitHub が取得条件を拒否したか、この取得先を一時的に制限しています。条件を確認し、時間をおいて再試行してください。"
  http: "GitHub の読み取りに失敗しました（HTTP %{status}）。ページは未取得です。"
  transport: "GitHub への要求を完了できませんでした。接続を確認して再試行してください。"
