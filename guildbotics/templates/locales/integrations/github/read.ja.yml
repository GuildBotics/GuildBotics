ja:
  resource: "未対応のリソースです。dependency_alerts を指定してください。"
  repository: "リポジトリは URL やパスではなく owner/name 形式で指定してください。"
  identifier: "GitHub の個別取得では正のアラート番号を identifier に指定してください。一覧では省略してください。"
  parameters: "取得条件が不正です。dependency_alerts には state（open、resolved、dismissed）と page_size（1～100）を指定できます。identifier を指定した個別取得では条件を受け付けません。"
  continuation: "ページ送りの応答または継続指定が不正です。同じリソース・リポジトリ・識別子・取得条件を使用してください。"
  too_large: "GitHub の応答がページ上限を超えました。一覧では page_size を減らしてください。個別項目が上限を超える場合は返せません。"
  response: "GitHub の応答形式が不正なため、ページを取得できませんでした。"
  rate_limit: "GitHub がリクエストを制限しました。時間をおいて再試行してください。ページは未取得です。"
  authentication: "GitHub が認証を拒否しました。メンバーの GitHub 認証情報を確認してください。"
  forbidden: "GitHub がアクセスを拒否しました。メンバーの認証情報（GitHub App の承認済み権限、または fine-grained PAT の権限）に Dependabot alerts の読み取り権限があるか、対象リポジトリにアクセスできるかを確認してください。この応答だけでは原因を断定できません。"
  not_found: "GitHub から対象を取得できませんでした。対象が存在しない、アクセスできない、Dependabot alerts が無効などの可能性があります。リポジトリ・番号・権限・機能設定を確認してください。"
  rejected: "GitHub が取得条件を拒否したか、この取得先を一時的に制限しています。条件を確認し、時間をおいて再試行してください。"
  http: "GitHub の読み取りに失敗しました（HTTP %{status}）。ページは未取得です。"
  transport: "GitHub への要求を完了できませんでした。接続を確認して再試行してください。"
