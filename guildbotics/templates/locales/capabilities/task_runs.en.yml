en:
  waiting_status: "--waiting-for is accepted only for asking/blocked."
  waiting_member: "Cannot wait for '%{person}': choose a team member other than yourself from the context roster."
  owner_notified: "The owner will be notified because no waiting member was named."
  waiting_item: "Cannot wait for '%{person}': the patrol does not currently dispatch this request to that member. Address an eligible author, reviewer, assignee, or mentioned member on the item first."
  comment_required: "Run '%{run_id}' cannot be completed as %{status} before you comment on the ticket or pull request: post your question, or what blocks the work, there first (ticket comment, pr comment, pr reply, or pr review). That comment is where a person picks the work back up."
  store_failed: "The run record could not be accessed safely."
  identity_changed: "The run or its evidence changed during completion; inspect it and retry."
  evidence_required: "The run has no required write evidence."
  not_completed: "The run has no completion record."
  repair_required: "Repair work cannot stop for asking/blocked or finish without an open PR linked to its repair ticket or a retried job. Fix the failure, open a PR reverting the cause, or retry the failed job with checks retry if the external cause has cleared."
  work_remains_status: "--work-remains requires done ticket work."
  ticket_completed: "Ticket work is recorded as complete. Patrol will move the ticket to done when its linked PR merges."
  ticket_work_remaining: "Ticket work remains. Patrol will resume it when all linked open PRs have merged or closed."
  ticket_asking: "Ticket work is waiting for an answer."
  ticket_blocked: "Ticket work is blocked."
  ticket_awaiting_checks: "Ticket work is waiting for required checks."
  work_remains_open_pr: "--work-remains requires an open PR linked to this ticket. Work without a PR, or resumed after a merge, cannot wait again with this option. Continue the remaining work; use asking/blocked if a person must answer or act."
