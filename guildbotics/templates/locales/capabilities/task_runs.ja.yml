ja:
  waiting_status: "--waiting-for は asking / blocked で終えるときだけ指定できます。"
  waiting_member: "'%{person}' は待ち先に指定できません。名簿から自分以外のチームのメンバーを指定してください。"
  owner_notified: "待ち先が指定されていないため、オーナーに通知されます。"
  waiting_item: "'%{person}' は待ち先に指定できません。現在の依頼を巡回がそのメンバーに渡しません。先に項目上で、対象となる作者・レビュアー・担当・メンションされたメンバーへ依頼してください。"
  comment_required: "run '%{run_id}' は、チケットか pull request にコメントする前には %{status} で完了できません。先に、質問または作業を妨げているものをそこへ投稿してください（ticket comment、pr comment、pr reply、または pr review）。そのコメントが、人が作業を再開させる場所になります。"
  store_failed: "run 記録を安全に読み書きできませんでした。"
  identity_changed: "完了の検証中に run または evidence が変更されました。確認して再実行してください。"
  evidence_required: "run の完了に必要な書込みの evidence がありません。"
  not_completed: "run の完了記録はまだありません。"
  repair_required: "修復の作業は asking / blocked で完了できません。done にはこの作業の修復チケットにリンクした開いた PR、またはジョブ再実行の証拠が必要です。修正するか、原因の変更を戻す PR を作成してください。範囲の外の原因が消えている場合は checks retry で失敗したジョブを流し直してください。"
  work_remains_status: "--work-remains は ticket 作業の done でのみ指定できます。"
  ticket_completed: "チケットの作業を完了と記録しました。つながった PR がマージされると、巡回がチケットを完了へ移動します。"
  ticket_work_remaining: "チケットの残作業を記録しました。つながった open PR がすべてマージまたはクローズされると、巡回が残作業を再開します。"
  ticket_asking: "チケットの作業は回答待ちです。"
  ticket_blocked: "チケットの作業は対応待ちです。"
  ticket_awaiting_checks: "チケットの作業は必須チェックを待っています。"
  work_remains_open_pr: "--work-remains には、このチケットにつながった open PR が必要です。PR のない作業や、マージ後に再開した作業をこの指定で再び待機させることはできません。残作業を進めてください。人の回答・対応が必要なら asking/blocked を使ってください。"
