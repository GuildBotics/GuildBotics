en:
  member_workspace_mismatch: "This CLI uses a different workspace from the running server (%{workspace}). Stop the service on the Service screen and select the workspace under Setup → Project, or stop the server with `guildbotics server stop`, run `guildbotics workspace use <path>`, and start it again."
  member_backend_closing: "The GuildBotics server is shutting down. Start it again after it has stopped, then run the command again."
  member_invalid_request: "The member transport request is invalid."
  member_version_mismatch: "CLI and server versions differ. Restart the server after updating its checkout, and use the CLI of the same checkout."
  member_workspace_argument: "Pass a workspace ID; --workspace is resolved by the client."
  member_request_too_large: "The member transport request exceeds its size limit or has no metadata."
  cli_agent_usage_failed: "Could not retrieve %{label} usage. The cause has not been identified. Check again or open the error details in the tool's settings."
  command_workspace_changing: "The server's workspace is being switched. Try again after it finishes."
  command_cancelled: "The run was cancelled because the service or the server stopped. Its record shows how far it got."
  # One key per sentence. A code that answers several situations nests one
  # key per situation; the pair of this file and errors.ja.yml is what keeps
  # the two languages saying the same thing.
  unauthorized: "This request has no valid session or token. Open GuildBotics again with `guildbotics open` on the server machine."
  csrf_mismatch: "The request did not carry this session's CSRF value, so nothing was changed. Reload the page and try again."
  invalid: "The request does not match what was authorized, so it was refused."
  misdirected: "This request names another host than the GuildBotics server."
  origin_mismatch: "Requests from another site are refused."
  command_workspace_changed: "The server's workspace changed before the command started. Run the command again."
  validation_error: "Request validation failed."
  secret_store_unavailable: "The OS secret store could not be used: %{reason}"
  config_busy: "Another save is still writing to this workspace, so nothing was saved. Try again in a moment."
  config_changed: "This screen was loaded before a more recent change, so nothing was saved. Reload it and make the change again."
  project_not_found: "Project config was not found."
  person_id_mismatch: "person_id must match the path parameter."
  avatar_not_found: "Avatar file not found."
  avatar_save_failed: "Failed to save avatar."
  avatar_import_failed: "Failed to import avatar from %{provider}."
  avatar_provider_unknown: "This provider has no avatar to import."
  command_input_file_save_failed: "Failed to save the file for the command."
  command_cwd_not_absolute: "'%{cwd}' is not an absolute path. Name the working directory from the root (~ is fine)."
  workspace_not_found: "Workspace directory was not found."
  workspace_not_directory: "Workspace path must be a directory."
  workspace_switch_blocked_by_active_work: "Service or command work is still running. Stop it before switching workspaces."
  person_not_found:
    plain: "Person '%{person}' not found."
    with_available: "Person '%{person}' not found. Available: %{available}"
  person_selection_required: "Specify a person using person or '<command>@person'. Available: %{available}"
  command_not_runtime_target: "The selected command file is not the runtime execution target."
  service_already_running: "Another background service is already running."
  service_settings_invalid: "The service settings in %{path} cannot be read. Fix or delete the file: %{reason}"
  runtime_running: "Stop the service before resetting chat receive state."
  invalid_activity_history_range: "Activity history start must be before end."
  invalid_activity_sync_range:
    together: "Activity sync start and end must be provided together."
    timestamps: "Activity sync start and end must be valid timestamps."
    order: "Activity sync start must be before end."
  config_not_found: "GuildBotics configuration is not available. Run config init first."
  command_already_running: "Another command is already running."
  command_file_not_found:
    unknown: "Unknown command file: '%{file_id}'."
    escapes: "Command path escapes the shared root: '%{relative}'."
  command_file_changed:
    reloaded: "The command file changed since it was loaded."
    retargeted: "The proposed update no longer targets the selected command."
    proposal: "The command file changed since the proposal was created."
  command_file_invalid_name:
    value: "Invalid command name: '%{command}'."
    path: "The proposed command path does not match its name and format."
  command_file_invalid_source: "Command source must not contain NUL bytes."
  command_file_too_large: "Command source exceeds the maximum allowed size."
  command_file_exists:
    exists: "Command '%{command}' already exists."
    duplicate: "Command '%{command}' is proposed more than once."
  command_file_shadowed: "Command '%{command}' would be shadowed by a higher-priority file."
