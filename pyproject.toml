[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "guildbotics"
dynamic = ["version"]
description = "A tool to collaborate with AI agents via a task board"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.15"
license-files = [
  "LICENSE",
  "third_party_licenses/**",
]
authors = [
  { name = "Ototadana" },
]
keywords = ["agents", "multi-agent", "automation", "workflow"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: 3 :: Only",
  "Intended Audience :: Developers",
  "Environment :: Console",
  "Topic :: Utilities",
]
dependencies = [
  "pydantic>=2.11,<3.0",
  "PyYAML>=6.0",
  "httpx>=0.28,<1.0",
  "python-i18n>=0.3",
  "langcodes[data]>=3.3",
  "tzdata>=2025.2",
  # Engines/brains
  "agno>=2.8,<3.0",
  "requests>=2.32",
  "google-genai>=2.17,<3.0",
  "openai>=1.106,<3.0",
  "anthropic>=0.40,<1.0",
  "jinja2>=3.1.6",
  "markdown-it-py>=4.0.0",
  "weasyprint>=70.0",
]

[project.urls]
Homepage = "https://github.com/GuildBotics/GuildBotics"
Source = "https://github.com/GuildBotics/GuildBotics"
Issues = "https://github.com/GuildBotics/GuildBotics/issues"

[project.optional-dependencies]
dev = [
  "black>=26.10.1",
  "mypy>=1.15",
  "pylint>=4.0.9",
  "ruff>=0.11",
  "types-requests>=2.32",
  "types-PyYAML>=6.0",
  "import-linter>=2.5",
]
test = [
  "GitPython>=3.2.1",
  "grimp>=3.9",
  # 9.1.0 and 9.1.1 drop a directory's conftest fixtures for files collected
  # after it is revisited on the command line (pytest-dev/pytest#14964). Drop
  # the exclusions once they are no longer the newest releases.
  "pytest>=8.2,!=9.1.0,!=9.1.1",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "pytest-xdist>=3.6",
]
redis = [
  "redis>=5.0",
]


[tool.pytest.ini_options]
markers = [
  "real_device(opt_in): test using a real device with an explicit opt-in",
  "windows: exercises a host OS boundary that must also work on real Windows",
]
# A test that waits for something that never comes fails instead of stopping
# the suite. Far above what any test takes, even on the slowest CI runner;
# tests on the device's real agent environment say how long they may take.
timeout = 120


[tool.hatch.build.targets.wheel]
packages = ["guildbotics"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "guildbotics/_version.py"

[tool.ruff]
target-version = "py315"
extend-exclude = ["guildbotics/_version.py"]

[tool.ruff.lint]
select = [
  "F",
  "I",
  "B",
  "UP",
  "E",
  "SIM",
  "C4",
  "RUF005",
  "RUF001",
  "RUF002",
  "RUF009",
  "RUF010",
  "RUF012",
  "RUF021",
  "RUF022",
  "RUF059",
  "RUF100",
  "PLC0207",
  "PLR1711",
  "PLR1714",
  "PLR2004",
  "PLR5501",
  "PLW2901",
]
ignore = [
  "E501",
]

[tool.mypy]
python_version = "3.15"
packages = ["guildbotics"]
exclude = [
  "^tests/",
]
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pylint.main]
py-version = "3.15"

[tool.pylint.messages_control]
disable = ["all"]
enable = ["duplicate-code"]

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true

# Shared command code never imports the guest's execution adapters.
[tool.importlinter]
root_package = "guildbotics"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "shared-imports-no-guest"
name = "Shared code imports no guest implementation"
type = "forbidden"
source_modules = ["guildbotics.commands", "guildbotics.intelligences", "guildbotics.runtime", "guildbotics.loader", "guildbotics.entities", "guildbotics.utils"]
forbidden_modules = ["guildbotics.guest"]
