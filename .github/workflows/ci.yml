name: CI

# Branvil's CI (.branvil/ci.toml) runs every check it can on Linux. This
# workflow runs macOS Clippy and the Windows GNU client contracts.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  clippy-macos:
    # The job runs for every change, so its check always reports; Clippy runs
    # only when the change concerns the Rust code.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # A pull request is compared with the first parent of its merge commit,
      # the base, and a push with main before it: the diff is what the change
      # brings to main. A rename lists both of its paths; a failing diff fails
      # the job rather than skipping its checks.
      - name: Detect changes
        id: changes
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
        run: |
          changed="$(git -c core.quotePath=false diff --name-only --no-renames "$BASE" HEAD)"
          rust=false
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/ci.yml | *.rs | Cargo.toml | */Cargo.toml | Cargo.lock | rust-toolchain*) rust=true ;;
            esac
          done <<<"$changed"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

      # The version and components of rust-toolchain.toml.
      - name: Install Rust
        if: steps.changes.outputs.rust == 'true'
        run: rustup toolchain install

      - name: Clippy
        if: steps.changes.outputs.rust == 'true'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  client-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect changes
        id: changes
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
        run: |
          changed="$(git -c core.quotePath=false diff --name-only --no-renames "$BASE" HEAD)"
          rust=false
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/ci.yml | *.rs | Cargo.toml | */Cargo.toml | Cargo.lock | rust-toolchain*) rust=true ;;
            esac
          done <<<"$changed"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        if: steps.changes.outputs.rust == 'true'
        run: |
          rustup toolchain install
          rustup target add x86_64-pc-windows-gnu
      - uses: msys2/setup-msys2@v2
        if: steps.changes.outputs.rust == 'true'
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc
      - name: Build distributable client
        shell: msys2 {0}
        if: steps.changes.outputs.rust == 'true'
        run: |
          cargo build --locked -p guildbotics --no-default-features --target x86_64-pc-windows-gnu --release
          test "$(wc -c < target/x86_64-pc-windows-gnu/release/guildbotics.exe)" -le 67108864
      - name: Windows client contracts
        shell: msys2 {0}
        if: steps.changes.outputs.rust == 'true'
        run: |
          status=0
          cargo test --locked --no-fail-fast -p guildbotics -p gb-server -p gb-environment -p gb-base -p gb-config --no-default-features --target x86_64-pc-windows-gnu --lib --bins || status=1
          cargo test --locked --no-fail-fast -p guildbotics --no-default-features --target x86_64-pc-windows-gnu --test main || status=1
          exit "$status"
      - name: Run without the build checkout
        shell: msys2 {0}
        if: steps.changes.outputs.rust == 'true'
        run: |
          scratch="$(mktemp -d)"
          cp target/x86_64-pc-windows-gnu/release/guildbotics.exe "$scratch/guildbotics.exe"
          source="$GITHUB_WORKSPACE"
          cd "$scratch"
          moved=()
          restore_source() {
            local status=0
            for dir in "${moved[@]}"; do
              mv "$source/$dir.source-away" "$source/$dir" || status=$?
            done
            return "$status"
          }
          trap restore_source EXIT
          for dir in guildbotics skills; do
            mv "$source/$dir" "$source/$dir.source-away"
            moved+=("$dir")
          done
          mkdir -p "$scratch/home/.codex"
          export USERPROFILE="$(cygpath -w "$scratch/home")" GUILDBOTICS_HOME="$(cygpath -w "$scratch/home/.guildbotics")" CODEX_HOME="$(cygpath -w "$scratch/home/.codex")"
          ./guildbotics.exe version
          ./guildbotics.exe --help
          ./guildbotics.exe install
          test -f "$scratch/home/.agents/skills/guildbotics/SKILL.md"
      - uses: actions/upload-artifact@v7
        if: steps.changes.outputs.rust == 'true'
        with:
          name: guildbotics-client-windows-x86_64-gnu
          path: target/x86_64-pc-windows-gnu/release/guildbotics.exe
          if-no-files-found: error
