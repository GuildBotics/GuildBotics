name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check internal Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: >-
            --no-progress
            --scheme file
            --include-fragments
            --extensions md
            './*.md'
            docs desktop skills
          fail: true

  test:
    runs-on: ubuntu-latest
    env:
      UV_LOCKED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra test --extra dev

      - name: Check generated CLI reference
        run: uv run --no-sync python scripts/generate-cli-reference.py --check

      - name: Run Ruff format
        run: uv run --no-sync ruff format --check guildbotics tests

      - name: Run Ruff
        run: uv run --no-sync ruff check --output-format=github guildbotics

      - name: Run Mypy
        run: uv run --no-sync mypy guildbotics

      - name: Run Pylint duplicate-code
        run: uv run --no-sync pylint guildbotics

      - name: Run tests
        run: uv run --no-sync python -m pytest tests/ -n auto --durations=30

  test-windows:
    # Windows in parallel with the Linux job, because a change that only breaks
    # Windows is otherwise found weeks later by whoever happens to run the
    # suite there. Only the checks whose result can differ by operating system
    # run here: Ruff, Pylint and the CLI reference cannot.
    runs-on: windows-latest
    name: test-windows (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard:
          - git-contracts
          - remainder
    env:
      UV_LOCKED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra test --extra dev

      - name: Run Mypy
        if: matrix.shard == 'remainder'
        run: uv run --no-sync mypy guildbotics

      - name: Verify Windows shard coverage
        run: >-
          uv run --no-sync python -m pytest tests/ --collect-only -qq
          --verify-windows-shards

      - name: Run tests
        # A short base directory: tests create Git repositories, whose own
        # paths are long enough to pass MAX_PATH from the default one.
        # Eight workers keep Git subprocess and file-I/O waits from leaving a
        # long tail on the four-core hosted runner.
        run: >-
          uv run --no-sync python -m pytest tests/ -n 8 --durations=30
          --windows-shard=${{ matrix.shard }}
          --basetemp=${{ runner.temp }}/gb
          --junitxml=${{ runner.temp }}/pytest-windows-${{ matrix.shard }}.xml
          --phase-durations-json=${{ runner.temp }}/pytest-windows-${{ matrix.shard }}-phases.json

      - name: Upload Windows pytest durations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-pytest-durations-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/pytest-windows-${{ matrix.shard }}.xml
            ${{ runner.temp }}/pytest-windows-${{ matrix.shard }}-phases.json
          if-no-files-found: error
