name: CI

# Branvil's CI (.branvil/ci.toml) runs every check it can on Linux. This
# workflow runs only what it cannot: the Windows contracts, and Clippy on the
# code built for macOS alone (`#[cfg(target_os = "macos")]`).

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-windows:
    # Linux runs the full suite. Windows checks the host OS boundaries: native
    # paths and locks, process lifecycle, and Git for Windows integration.
    runs-on: windows-latest
    env:
      UV_LOCKED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra test --extra dev

      - name: Run Mypy
        run: uv run --no-sync mypy guildbotics

      - name: Run tests
        # A short base directory: tests create Git repositories, whose own
        # paths are long enough to pass MAX_PATH from the default one.
        # The selected contracts need no second runner or full-suite shards.
        run: >-
          uv run --no-sync python -m pytest tests/ -m windows --strict-markers
          -n 4 --durations=30
          --basetemp=${{ runner.temp }}/gb
          --junitxml=${{ runner.temp }}/pytest-windows.xml
          --phase-durations-json=${{ runner.temp }}/pytest-windows-phases.json

      - name: Upload Windows pytest durations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-pytest-durations
          path: |
            ${{ runner.temp }}/pytest-windows.xml
            ${{ runner.temp }}/pytest-windows-phases.json
          if-no-files-found: error

  clippy-macos:
    # The job runs for every change, so its check always reports; Clippy runs
    # only when the change concerns the Rust code.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # A pull request is compared with the first parent of its merge commit,
      # the base, and a push with main before it: the diff is what the change
      # brings to main. A rename lists both of its paths; a failing diff fails
      # the job rather than skipping its checks.
      - name: Detect changes
        id: changes
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
        run: |
          changed="$(git -c core.quotePath=false diff --name-only --no-renames "$BASE" HEAD)"
          rust=false
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/ci.yml | *.rs | Cargo.toml | */Cargo.toml | Cargo.lock | rust-toolchain*) rust=true ;;
            esac
          done <<<"$changed"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

      # The version and components of rust-toolchain.toml.
      - name: Install Rust
        if: steps.changes.outputs.rust == 'true'
        run: rustup toolchain install

      - name: Clippy
        if: steps.changes.outputs.rust == 'true'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
